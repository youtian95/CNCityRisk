[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CNCityRisk"
version = "0.1.1"
description = "Regional seismic risk assessment of buildings of major cities in China"
authors = [
    { name="Tian You", email="youtian@njtech.edu.cn" }
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = ["seismic", "risk assessment", "building resilience", "China", "earthquake"]
dependencies = [
    "BldStructPred",
    "MDOFModel",
    "BldCluster",
    "h5py",
    "folium",
    "openquake.engine",
    "cartopy",
    "dask",
    "geojsoncontour",    
    "addressparser",
    "pypinyin",
    "py7zr",
    "rasterio",
    "numpy==1.26.0",
]

[project.urls]
Homepage = "https://github.com/youtian95/CNCityRisk"
"Bug Tracker" = "https://github.com/youtian95/CNCityRisk/issues"

[tool.hatch.build.targets.wheel]
artifacts = [
  "CNCityRisk/Data/BldData/",
]

[tool.hatch.build.targets.sdist]
artifacts = [
  "CNCityRisk/Data/BldData/",
]