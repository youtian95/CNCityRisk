[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CNCityRisk"
version = "0.3.4"
description = "Regional seismic risk assessment of buildings of major cities in China"
authors = [
    { name="Tian You", email="youtian@njtech.edu.cn" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
keywords = ["seismic", "risk assessment", "building resilience", "China", "earthquake"]
dependencies = [
    "openquake.engine",
    "BldStructPred",
    "MDOFModel",
    "BldCluster",
    "h5py",
    "folium",
    "cartopy",
    "dask",
    "geojsoncontour",    
    "addressparser",
    "pypinyin",
    "py7zr",
    "rasterio",
    "numpy==1.26.2",
    "cnmaps",
]

[project.urls]
Homepage = "https://github.com/youtian95/CNCityRisk"
"Bug Tracker" = "https://github.com/youtian95/CNCityRisk/issues"

[tool.hatch.build.targets.sdist]
exclude = [
  "CNCityRisk/results/BldData/*.csv",
  "CNCityRisk/results/BldData/Region_*",
]

[tool.hatch.build.targets.wheel]
exclude = [
  "CNCityRisk/results/BldData/*.csv",
  "CNCityRisk/results/BldData/Region_*",
]